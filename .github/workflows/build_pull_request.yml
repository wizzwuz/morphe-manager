name: Build APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - main

concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Fork PRs or repos without keystore secrets fall back to an unsigned/debug build
      - name: Determine if PR is from a fork
        id: fork_check
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || ([ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]); then
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
            echo "gradle_task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_dir=app/build/outputs/apk/debug" >> "$GITHUB_OUTPUT"
            echo "apk_suffix=-debug" >> "$GITHUB_OUTPUT"
            echo "No keystore secret or PR from fork: building debug APK"
          else
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
            echo "gradle_task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk_dir=app/build/outputs/apk/release" >> "$GITHUB_OUTPUT"
            echo "apk_suffix=-release" >> "$GITHUB_OUTPUT"
            echo "Trusted PR/dispatch: building signed release APK"
          fi

      - name: Restore release keystore
        if: steps.fork_check.outputs.is_fork == 'false' && secrets.KEYSTORE_B64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > app/keystore.jks
          ls -la app/keystore.jks

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          # 17 and 25 are the toolchains that build the embedded JVMs, 17 also shrinks their host.
          # The last one listed, 21, stays the default that runs Gradle
          java-version: |
            17
            25
            21

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Run unit tests
        env:
          # Needed to resolve morphe-patcher from GitHub Packages, which rejects
          # anonymous reads even for public packages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          _JAVA_OPTIONS: "-Djava.awt.headless=true"
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      # lintVital is disabled in the app build script, so release builds run no
      # checks of their own; this step is the only place lint gates a change
      - name: Run lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          _JAVA_OPTIONS: "-Djava.awt.headless=true"
        run: |
          chmod +x ./gradlew
          ./gradlew :app:lint --stacktrace

      - name: Build APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
          _JAVA_OPTIONS: "-Djava.awt.headless=true"
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ steps.fork_check.outputs.gradle_task }} --stacktrace

      - name: Rename APK
        run: |
          suffix="${{ steps.fork_check.outputs.apk_suffix }}"
          for f in ${{ steps.fork_check.outputs.apk_dir }}/*${suffix}.apk; do
            [ -e "$f" ] || continue
            mv "$f" "${f/${suffix}/}"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ steps.fork_check.outputs.apk_dir }}/*.apk
